<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Articolo — Idee da Diffondere</title>
  <meta name="description" content="" />
  <meta name="theme-color" content="#f1efe9" />
  <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />

  <script>
    (function () {
      var root = document.documentElement;

      try {
        var storedTheme = localStorage.getItem('idd-theme');
        if (storedTheme === 'dark' || (!storedTheme && matchMedia('(prefers-color-scheme: dark)').matches)) {
          root.dataset.theme = 'dark';
        }
      } catch (e) {}

      root.classList.add('pre-css');

      try {
        if (
          matchMedia('(pointer: fine)').matches &&
          !matchMedia('(prefers-reduced-motion: reduce)').matches
        ) {
          root.classList.add('has-cursor-trail');
        }
      } catch (e) {}

      addEventListener('load', function () {
        root.classList.remove('pre-css');
        if (!document.querySelector('.cursor-trail')) {
          root.classList.remove('has-cursor-trail');
        }
      });
    })();
  </script>

  <style>
    html { background: #f1efe9; }
    html[data-theme='dark'] { background: #111110; }
    html.pre-css body { visibility: hidden; }
  </style>

  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

  <link rel="preload" href="/loghi/logo.svg" as="image" />
</head>
<body class="pagina-articolo">

  <header class="site-nav scrolled">
    <a href="/" class="brand" aria-label="Idee da Diffondere — vai alla home">
      <span class="logo-mark" role="img" aria-label="Logo Associazione Idee da Diffondere"></span>
    </a>

    <div class="nav-right">
      <nav class="nav-links" aria-label="Navigazione principale">
        <a href="/#eventi">Eventi</a>
        <a href="/#stampa">Stampa</a>
        <a href="/#team">Team</a>
        <a href="/#contatti" class="btn btn-small">Contattaci</a>
      </nav>

      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambia tema" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.4" />
          <path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3 19 19M19 5l-1.7 1.7M6.7 17.3 5 19" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <path d="M20.2 14.5A8.3 8.3 0 0 1 9.5 3.8a8.3 8.3 0 1 0 10.7 10.7Z" />
        </svg>
      </button>

      <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Apri menu" aria-expanded="false">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <nav id="mobile-menu" class="mobile-menu" aria-label="Menu mobile">
    <a href="/#eventi">Eventi</a>
    <a href="/#stampa">Rassegna stampa</a>
    <a href="/#team">Team</a>
    <a href="/#contatti">Contattaci</a>
  </nav>

  <main id="articolo" class="articolo"></main>

  <footer class="site-footer">
    <div class="footer-top">
      <div class="footer-brand">
        <span class="logo-mark logo-footer" role="img" aria-label="Logo Associazione Idee da Diffondere"></span>
        <p class="footer-note">Cultura, comunità e idee che prendono forma.</p>
      </div>
    </div>

    <nav class="footer-links" aria-label="Navigazione footer">
      <a href="/#eventi">Eventi</a>
      <a href="/#stampa">Rassegna stampa</a>
      <a href="/#team">Team</a>
      <a href="/#contatti">Contattaci</a>
    </nav>

    <div class="footer-bottom">
      <span>© 2026 Associazione Idee da Diffondere</span>
    </div>
  </footer>

  <script type="module" blocking="render" src="/src/article/index.js"></script>
</body>
</html>
